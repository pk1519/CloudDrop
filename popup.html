<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Download Manager</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10,9 9,9 8,9"/>
                </svg>
                <h1>Drive Download Manager</h1>
            </div>
        </div>

        <!-- Authentication Status -->
        <div class="auth-section">
            <div id="auth-status" class="status-card">
                <div class="status-indicator" id="auth-indicator"></div>
                <div class="status-text">
                    <span id="auth-text">Not authenticated</span>
                    <div class="auth-buttons">
                        <button id="auth-btn" class="btn btn-primary">Login with Google</button>
                        <button id="logout-btn" class="btn btn-secondary" style="display: none;">Logout</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Controls -->
        <div class="main-content" id="main-content" style="display: none;">
            <!-- Cloud Mode Toggle -->
            <div class="toggle-section">
                <div class="toggle-card">
                    <div class="toggle-info">
                        <span class="toggle-label">Cloud Mode</span>
                        <span class="toggle-desc">Save downloads to Google Drive</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="cloud-mode-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- Storage Quota -->
            <div class="quota-section">
                <div class="quota-card">
                    <div class="quota-header">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="m15 9-6 6"/>
                            <path d="m9 9 6 6"/>
                        </svg>
                        <span>Storage Quota</span>
                    </div>
                    <div class="quota-info">
                        <div class="quota-bar">
                            <div class="quota-fill" id="quota-fill"></div>
                        </div>
                        <div class="quota-text">
                            <span id="quota-used">0 GB</span>
                            <span id="quota-total">/ 15 GB</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Folder Management -->
            <div class="folder-section">
                <div class="section-header">
                    <h3>Folder Management</h3>
                </div>
                
                <!-- Selected Folder -->
                <div class="selected-folder">
                    <div class="folder-info">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2Z"/>
                        </svg>
                        <div>
                            <span class="folder-label">Selected Folder:</span>
                            <span class="folder-name" id="selected-folder-name">Root</span>
                        </div>
                    </div>
                </div>

                <!-- Folder Actions -->
                <div class="folder-actions">
                    <button class="btn btn-secondary" id="browse-folders-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2Z"/>
                        </svg>
                        Browse Folders
                    </button>
                    <button class="btn btn-secondary" id="create-folder-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2Z"/>
                            <line x1="12" y1="13" x2="12" y2="19"/>
                            <line x1="9" y1="16" x2="15" y2="16"/>
                        </svg>
                        Create Folder
                    </button>
                </div>
            </div>

            <!-- Download History -->
            <div class="history-section">
                <div class="section-header">
                    <h3>Download History</h3>
                    <button class="btn btn-small" id="clear-history-btn">Clear</button>
                </div>
                <div class="history-list" id="history-list">
                    <div class="history-empty">No downloads yet</div>
                </div>
            </div>

            <!-- Settings -->
            <div class="settings-section">
                <div class="section-header">
                    <h3>Settings</h3>
                </div>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label for="file-type-filter">File Types:</label>
                        <select id="file-type-filter">
                            <option value="*">All Files</option>
                            <option value="images">Images Only</option>
                            <option value="documents">Documents Only</option>
                            <option value="videos">Videos Only</option>
                            <option value="custom">Custom...</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label for="max-file-size">Max File Size (MB):</label>
                        <input type="number" id="max-file-size" min="1" max="1000" value="100">
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
    </div>

    <!-- Folder Browser Modal -->
    <div class="modal" id="folder-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Select Folder</h3>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="folder-list" id="folder-list">
                    <!-- Folders will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Create Folder Modal -->
    <div class="modal" id="create-folder-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Folder</h3>
                <button class="close-btn" id="close-create-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="folder-name-input">Folder Name:</label>
                    <input type="text" id="folder-name-input" placeholder="Enter folder name">
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="cancel-create-folder">Cancel</button>
                    <button class="btn btn-primary" id="confirm-create-folder">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
